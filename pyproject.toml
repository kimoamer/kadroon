[project]
name = "kadroon"
authors = [
    { name = "Innomate LLC", email = "info@innomate-tech.com"}
]
description = "Adds private-sector payroll fields to the Employee doctype for government‑aligned HR compliance."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "xlsxwriter~=3.1.2"
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
